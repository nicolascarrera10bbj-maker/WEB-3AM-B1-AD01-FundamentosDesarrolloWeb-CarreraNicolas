<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller Automotriz - Login</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card p-4 shadow-sm" style="max-width: 400px; width: 100%;">
            <h3 class="text-center mb-2">Taller Automotriz</h3>
            <p class="text-muted text-center mb-4">LOGIN</p>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="usuario" class="form-label fw-semibold">Usuario</label>
                    <input type="text" class="form-control" id="usuario" required placeholder="Usuario">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" required placeholder="Contraseña">
                </div>
                
                <!-- Aviso de Temporizador de Bloqueo -->
                <div id="divTemporizador" class="alert alert-danger text-center py-2 mb-3 d-none small fw-bold">
                    ⏳ Bloqueado. Tiempo restante: <span id="contadorRegresivo">0</span>s
                </div>

                <button type="submit" id="btnIngresar" class="btn btn-primary w-100 mb-3">Ingresar</button>

                <div class="d-flex flex-column align-items-center gap-2 small">
                    <a href="#" id="btnRecuperar" class="text-decoration-none">¿Olvidaste tu Contraseña?</a>
                    <a href="#" id="btnCrearCuenta" class="text-decoration-none">Crear Tu Cuenta</a>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL RECUPERAR CONTRASEÑA -->
    <div class="modal fade" id="modalRecuperar" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content p-3 border-0 shadow-lg rounded-4">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold text-primary">🔑 Recuperar Contraseña</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="formRecuperarModal">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Ingresa tu usuario:</label>
                            <input type="text" id="inputUserRecuperar" class="form-control" placeholder="Ej: admin" required>
                        </div>
                        <div class="text-end">
                            <button type="submit" class="btn btn-primary btn-sm fw-bold px-3">Buscar Clave</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL CREAR CUENTA (Nombre Completo, Usuario, Contraseña) -->
    <div class="modal fade" id="modalCrear" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content p-3 border-0 shadow-lg rounded-4">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold text-primary">👤 Crear Nueva Cuenta</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="formCrearModal">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Nombre Completo:</label>
                            <input type="text" id="inputNombreCompleto" class="form-control" placeholder="Ej. Juan Pérez" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Nombre de Usuario:</label>
                            <input type="text" id="inputNuevoUser" class="form-control" placeholder="Ej. jperez" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Contraseña:</label>
                            <input type="password" id="inputNuevaPass" class="form-control" placeholder="••••••" required>
                        </div>
                        <div class="text-end">
                            <button type="submit" class="btn btn-success btn-sm fw-bold px-3">Registrarse</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
