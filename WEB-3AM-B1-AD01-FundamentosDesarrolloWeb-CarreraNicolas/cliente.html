<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Cliente - Taller</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">

    <div class="container d-flex flex-column justify-content-center align-items-center min-vh-100 py-4">
        
        <div class="w-100" style="max-width: 900px;">
            
            <div class="d-flex justify-content-between align-items-center mb-3 px-2">
                <h4 class="text-white m-0">Portal del Cliente</h4>
                <div>
                    <button class="btn btn-outline-info btn-sm me-2" onclick="abrirHistorialCliente()">Ver Historial</button>
                    <button id="btnSalirCliente" class="btn btn-outline-light btn-sm">Cerrar Sesión</button>
                </div>
            </div>

            <!-- FORMULARIO CON TARJETA BLANCA Y TEXTOS NEGRITAS OSCUROS -->
            <div class="card p-4 shadow-lg border-0 bg-white text-dark rounded-4">
                <h3 class="text-center mb-2 text-primary fw-bold">Registrar Solicitud de Servicio</h3>
                <p class="text-muted text-center small mb-4">Ingresa los datos de tu vehículo y la falla observada para ingresar al taller</p>

                <form id="formSolicitudCliente">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-dark">Nombre Completo:</label>
                            <input type="text" id="cliNombre" class="form-control bg-light text-dark border border-secondary-subtle" placeholder="Nombre y Apellido" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-dark">Teléfono de Contacto:</label>
                            <input type="text" id="cliTelefono" class="form-control bg-light text-dark border border-secondary-subtle" placeholder="Ej: 0998765432" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-bold text-dark">Vehículo (Marca / Modelo):</label>
                            <input type="text" id="cliVehiculo" class="form-control bg-light text-dark border border-secondary-subtle" placeholder="Ej: Chevrolet Sail" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-bold text-dark">Placa:</label>
                            <input type="text" id="cliPlaca" class="form-control bg-light text-dark border border-secondary-subtle" placeholder="Ej: ABC-1234" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-bold text-dark">Kilometraje Actual:</label>
                            <input type="number" id="cliKm" class="form-control bg-light text-dark border border-secondary-subtle" placeholder="Ej: 45000" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label small fw-bold text-dark">Descripción de la Falla o Servicio requerido:</label>
                            <textarea id="cliProblema" class="form-control bg-light text-dark border border-secondary-subtle" rows="3" placeholder="Ej: Ruido al frenar y fugas de líquido..." required></textarea>
                        </div>
                    </div>

                    <div class="text-end mt-4">
                        <button type="submit" class="btn btn-primary fw-bold px-4">Enviar Solicitud al Taller</button>
                    </div>
                </form>
            </div>

        </div>

    </div>

    <!-- MODAL 1: HISTORIAL DE SOLICITUDES DEL CLIENTE -->
    <div class="modal fade" id="modalHistorialCliente" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-xl">
            <div class="modal-content bg-dark text-white border-secondary shadow-lg">
                <div class="modal-header border-secondary bg-primary bg-opacity-25">
                    <h5 class="modal-title">📋 Historial de Solicitudes y Mantenimientos</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="table-responsive">
                        <table class="table table-dark table-striped table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>Vehículo</th>
                                    <th>Placa</th>
                                    <th>Teléfono</th>
                                    <th>Kilometraje</th>
                                    <th>Falla / Servicio</th>
                                    <th>Estado</th>
                                    <th class="text-center">Detalles</th>
                                </tr>
                            </thead>
                            <tbody id="tablaClienteSolicitudes">
                                <!-- Se carga dinámicamente -->
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL 2: TARJETA DE VISTA / DETALLE (SOLO VISUALIZACIÓN) -->
    <div class="modal fade" id="modalDetallesCliente" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content bg-dark text-white border-secondary shadow-lg">
                <div class="modal-header border-secondary bg-info bg-opacity-25">
                    <h5 class="modal-title text-info">🔍 Tarjeta de Reporte Mecánico</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="contenidoTarjetaCliente" class="p-2">
                        <!-- Se dibuja el reporte de solo lectura dinámicamente -->
                    </div>
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-info text-dark fw-bold btn-sm w-100" data-bs-dismiss="modal">Entendido</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Script Cliente -->
    <script src="cliente.js"></script>
</body>
</html>
